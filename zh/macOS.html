<h4>打开"终端"（不需要管理员密码），执行：</h4>

<br/>
<code style="display:inline-block; margin-top:4px; padding:4px 8px; background:#f4f4f4; border-radius:4px;">curl -fsSL https://lomosw.lomorage.com/mac/install.sh | LOMOD_CHINA=1 bash</code>

<br/><br/>
<p>这会把"Lomorage"自动安装到你的用户目录下并启动——没有 .dmg 安装包，不需要重启电脑。菜单栏和 <code>~/Applications</code>（可以用 Spotlight/Launchpad 找到）都会出现"Lomorage"图标，随时可以从这两个地方打开它。</p>

<p>更多细节（自定义数据目录、手机访问、卸载等）请参考<a href="https://docs.lomorage.com/zh/docs/Installation/lomorage-service/installation-osx/">完整安装文档</a>。</p>
