<h4>打开 PowerShell（不需要管理员权限），粘贴执行：</h4>

<br/>
<code style="display:inline-block; margin-top:4px; padding:4px 8px; background:#f4f4f4; border-radius:4px;">$env:LOMOD_CHINA=1; irm https://lomosw.lomorage.com/windows/install.ps1 | iex</code>

<br/><br/>
<p>这会把"Lomorage"自动安装到你的用户目录下并启动——没有安装向导窗口，不需要重启电脑。"开始"菜单和系统托盘都会出现"Lomorage"图标，随时可以从这两个地方打开它。它每天会自动检查并安装新版本，不需要任何操作。</p>

<p>更多细节（自定义数据目录、手机访问、卸载等）请参考<a href="https://docs.lomorage.com/zh/docs/Installation/lomorage-service/installation-win/">完整安装文档</a>。</p>
